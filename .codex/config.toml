# Codex 프로젝트 설정 (팀 공용, 커밋 대상). 개인 설정은 ~/.codex/config.toml 에 둔다.
# Codex는 신뢰(trusted)한 프로젝트에서만 이 파일(.codex/ 레이어)의 MCP·훅을 읽는다.
# 훅은 처음 한 번 Codex CLI의 /hooks 에서 검토·신뢰해야 실행된다(내용이 바뀌면 다시 신뢰).
# 문서: https://learn.chatgpt.com/docs/config-file/config-basic , https://learn.chatgpt.com/docs/extend/mcp , https://learn.chatgpt.com/docs/hooks

# Context7 문서 MCP (원격 Streamable HTTP). 키는 선택: CONTEXT7_API_KEY 환경변수가 있으면 X-API-Key 헤더로 보낸다.
# 환경변수가 없거나 비어 있으면 Codex가 헤더를 빼고 익명으로 접속한다.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { "X-API-Key" = "CONTEXT7_API_KEY" }
startup_timeout_sec = 20

# 세션 시작 시 개발환경 점검 + 에뮬레이터·백엔드 자동 기동 (scripts/setup.sh 기본 모드).
# 훅은 세션 cwd에서 실행되므로 git 루트 기준 경로를 쓴다. 출력(stdout)은 개발자 컨텍스트로 들어간다.
[[hooks.SessionStart]]
matcher = "startup"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/setup.sh" || true'
timeout = 30
statusMessage = "개발환경 점검 (scripts/setup.sh)"
