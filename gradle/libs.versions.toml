[versions]
# 빌드 도구
agp = "9.4.1"
kotlin = "2.4.21"
spring-boot = "4.1.2"
idea-ext = "1.4.1"            # IDE 동기화 후 devSetup 실행(taskTriggers)

# Android 앱
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "28"          # 공모전 필수: API 28 이상
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"
pleos-vehicle = "2.3.2"
pleos-navihelper = "3.0.5"
pleos-fusedlocation = "1.1.3"
pleos-tts = "3.3.1"
pleos-stt = "3.3.1"

# 공용
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
junit-bom = "6.0.3"

[libraries]
# Android
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "pleos-vehicle" }
pleos-navihelper = { module = "ai.pleos.playground:NaviHelper", version.ref = "pleos-navihelper" }
pleos-fusedlocation = { module = "ai.pleos.playground:FusedLocation", version.ref = "pleos-fusedlocation" }
pleos-tts = { module = "ai.pleos.playground:TextToSpeech", version.ref = "pleos-tts" }
pleos-stt = { module = "ai.pleos.playground:SpeechToText", version.ref = "pleos-stt" }

# Kotlin
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Backend (버전은 Spring Boot BOM이 관리)
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }

# Test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }
